<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Online Çekiliş</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    overflow: hidden;
}

/* ÜST BAR */
#topBar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 20px;
    z-index: 2;
}

#topBar input {
    padding: 10px;
    font-size: 16px;
    width: 220px;
}

#topBar button {
    padding: 10px 16px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
}

#addBtn { background: #2ecc71; }
#drawBtn { background: #3498db; }

/* OYUNCU ALANI */
#playersWrapper {
    position: absolute;
    top: 90px;
    left: 120px;
    right: 40px;
    bottom: 20px;
    overflow: hidden;
}

#players {
    display: flex;
    gap: 40px;
    transition: transform 0.5s ease;
}

.column {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.player {
    background: #e6fff0;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    white-space: nowrap;
}

/* KAZANAN EKRANI */
#winnerScreen {
    position: fixed;
    inset: 0;
    background: white;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 20;
}

#winnerBox {
    text-align: center;
    padding: 40px;
}

#winnerName {
    font-size: 64px;
    font-weight: bold;
    margin: 20px 0;
}

#winnerBox button {
    margin-top: 30px;
    padding: 12px 24px;
    font-size: 16px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

/* TİLKİLER */
.fox {
    position: fixed;
    font-size: 72px;
    opacity: 0.4;
    pointer-events: none;
}

/* KONFETİ */
.confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    animation: fall linear forwards;
    z-index: 30;
}

@keyframes fall {
    to {
        transform: translateY(120vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<div id="topBar">
    🦊
    <input id="playerInput" placeholder="Oyuncu adı gir">
    <button id="addBtn">Oyuncu Ekle</button>
    <button id="drawBtn">Çekiliş Yap</button>
</div>

<div id="playersWrapper">
    <div id="players"></div>
</div>

<div id="winnerScreen">
    <div id="winnerBox">
        <div style="font-size:60px">🦊</div>
        <div id="winnerName"></div>
        <div style="font-size:60px">🦊</div>
        <button onclick="back()">Geri Dön</button>
    </div>
</div>

<script>
const playersContainer = document.getElementById("players");
const wrapper = document.getElementById("playersWrapper");
let columns = [];
let maxPerColumn = 20;

/* OYUNCU EKLE */
function addPlayer(name) {
    if (!name) return;

    let col = columns[columns.length - 1];
    if (!col || col.children.length >= maxPerColumn) {
        col = document.createElement("div");
        col.className = "column";
        playersContainer.appendChild(col);
        columns.push(col);
    }

    const p = document.createElement("div");
    p.className = "player";
    p.textContent = name;
    col.appendChild(p);

    autoScroll();
}

document.getElementById("addBtn").onclick = () => {
    const i = document.getElementById("playerInput");
    addPlayer(i.value.trim());
    i.value = "";
};

document.getElementById("playerInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("addBtn").click();
});

/* OTOMATİK KAYDIRMA */
function autoScroll() {
    const diff = playersContainer.scrollWidth - wrapper.clientWidth;
    if (diff > 0) {
        playersContainer.style.transform = `translateX(-${diff + 40}px)`;
    }
}

/* ÇEKİLİŞ */
document.getElementById("drawBtn").onclick = () => {
    const all = [];
    columns.forEach(c => [...c.children].forEach(p => all.push(p.textContent)));
    if (!all.length) return;

    const winner = all[Math.floor(Math.random() * all.length)];
    document.getElementById("winnerName").textContent = winner;

    document.getElementById("winnerScreen").style.display = "flex";
    megaConfetti();
};

/* GERİ DÖN */
function back() {
    document.getElementById("winnerScreen").style.display = "true";
}

/* MANYAK KONFETİ */
function megaConfetti() {
    for (let i = 0; i < 300; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = `hsl(${Math.random()*360},100%,50%)`;
        c.style.animationDuration = (Math.random()*2 + 2) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
    }
}

/* TİLKİLER */
for (let i = 0; i < 14; i++) {
    const f = document.createElement("div");
    f.className = "fox";
    f.textContent = "🦊";
    f.style.left = Math.random()*100+"vw";
    f.style.top = Math.random()*100+"vh";
    document.body.appendChild(f);
}
</script>

</body>
</html>
