<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Online Çekiliş</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    overflow: hidden;
}

/* ÜST BAR */
#topBar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 20px;
}

#topBar input {
    padding: 8px;
    font-size: 16px;
    width: 200px;
}

#topBar button {
    padding: 8px 14px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
}

#addBtn { background: #2ecc71; }
#drawBtn { background: #3498db; }

/* OYUNCU ALANI */
#playersWrapper {
    position: absolute;
    top: 90px;
    left: 120px;
    right: 40px;
    bottom: 20px;
    overflow: hidden;
}

#players {
    display: flex;
    gap: 40px;
    transition: transform 0.5s ease;
}

.column {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.player {
    background: #e9f9ef;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 16px;
    white-space: nowrap;
}

/* KAZANAN EKRANI */
#winnerScreen {
    position: fixed;
    inset: 0;
    background: white;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
}

#winnerName {
    font-size: 48px;
    margin-top: 20px;
}

/* TİLKİLER */
.fox {
    position: fixed;
    font-size: 64px;
    opacity: 0.35;
    pointer-events: none;
}

/* KONFETİ */
.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}
</style>
</head>

<body>

<div id="topBar">
    🦊
    <input id="playerInput" placeholder="Oyuncu adı gir">
    <button id="addBtn" onclick="addPlayerBtn()">Oyuncu Ekle</button>
    <button id="drawBtn" onclick="draw()">Çekiliş Yap</button>
</div>

<div id="playersWrapper">
    <div id="players"></div>
</div>

<div id="winnerScreen">
    🦊🎉
    <div id="winnerName"></div>
</div>

<script>
const playersContainer = document.getElementById("players");
const wrapper = document.getElementById("playersWrapper");

let columns = [];
let maxPerColumn = 20;

/* OYUNCU EKLE */
function addPlayer(name) {
    if (!name) return;

    let col = columns[columns.length - 1];
    if (!col || col.children.length >= maxPerColumn) {
        col = document.createElement("div");
        col.className = "column";
        playersContainer.appendChild(col);
        columns.push(col);
    }

    const p = document.createElement("div");
    p.className = "player";
    p.textContent = name;
    col.appendChild(p);

    autoScroll();
}

/* BUTON */
function addPlayerBtn() {
    const input = document.getElementById("playerInput");
    addPlayer(input.value.trim());
    input.value = "";
}

/* ENTER */
document.getElementById("playerInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addPlayerBtn();
});

/* OTOMATİK KAYDIRMA */
function autoScroll() {
    const diff = playersContainer.scrollWidth - wrapper.clientWidth;
    if (diff > 0) {
        playersContainer.style.transform = `translateX(-${diff + 40}px)`;
    }
}

/* ÇEKİLİŞ */
function draw() {
    if (!columns.length) return;

    wrapper.style.display = "none";

    const all = [];
    columns.forEach(c => [...c.children].forEach(p => all.push(p.textContent)));

    const winner = all[Math.floor(Math.random() * all.length)];
    document.getElementById("winnerName").textContent = winner;
    document.getElementById("winnerScreen").style.display = "flex";

    confetti();
}

/* KONFETİ */
function confetti() {
    for (let i = 0; i < 120; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = `hsl(${Math.random()*360},100%,50%)`;
        c.style.animationDuration = (Math.random()*2+2)+"s";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }
}

/* TİLKİLER */
for (let i = 0; i < 12; i++) {
    const f = document.createElement("div");
    f.className = "fox";
    f.textContent = "🦊";
    f.style.left = Math.random()*100+"vw";
    f.style.top = Math.random()*100+"vh";
    document.body.appendChild(f);
}
</script>

</body>
</html>
