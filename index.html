<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Online Çekiliş</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
  overflow: hidden;
}

h1 {
  text-align: center;
  margin: 20px 0;
}

.controls {
  text-align: center;
  margin-bottom: 15px;
}

input {
  padding: 10px;
  font-size: 16px;
  width: 220px;
}

button {
  padding: 10px 16px;
  font-size: 16px;
  margin-left: 6px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  color: white;
}

.add { background: #2ecc71; }
.draw { background: #3498db; }

#playersWrapper {
  position: relative;
  width: 100%;
  height: 320px;
  overflow: hidden;
  margin-top: 10px;
}

#players {
  position: absolute;
  display: flex;
  gap: 40px;
  transition: transform 0.4s ease;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 160px;
  font-size: 15px;
}

#resultScreen {
  display: none;
  text-align: center;
  margin-top: 80px;
  font-size: 40px;
  font-weight: bold;
}

/* 🦊 Tilkiler */
.fox {
  position: absolute;
  font-size: 64px;
  opacity: 0.45;
  user-select: none;
  z-index: 0;
}

/* 🎉 Konfeti */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  animation: confettiFly 2.5s forwards;
}

@keyframes confettiFly {
  from { transform: translate(0,0) rotate(0deg); opacity:1; }
  to { transform: translate(var(--x), -350px) rotate(720deg); opacity:0; }
}
</style>
</head>

<body>

<h1>🎲 Online Çekiliş</h1>

<div class="controls">
  <input id="nameInput" placeholder="Oyuncu adı gir">
  <button class="add" onclick="addPlayer()">Oyuncu Ekle</button>
  <button class="draw" onclick="draw()">Çekiliş Yap</button>
</div>

<div id="playersWrapper">
  <div id="players"></div>
</div>

<div id="resultScreen"></div>

<script>
const players = [];
const playersDiv = document.getElementById("players");
const input = document.getElementById("nameInput");
let columns = [];

input.addEventListener("keydown", e => {
  if (e.key === "Enter") addPlayer();
});

function addPlayer() {
  const name = input.value.trim();
  if (!name) return;

  players.push(name);

  if (columns.length === 0 || columns[columns.length - 1].children.length >= 20) {
    const col = document.createElement("div");
    col.className = "column";
    playersDiv.appendChild(col);
    columns.push(col);
  }

  const item = document.createElement("div");
  item.textContent = "• " + name;
  columns[columns.length - 1].appendChild(item);

  const maxVisibleCols = Math.floor(window.innerWidth / 200);
  if (columns.length > maxVisibleCols) {
    const shift = (columns.length - maxVisibleCols) * 200;
    playersDiv.style.transform = `translateX(-${shift}px)`;
  }

  input.value = "";
}

function draw() {
  if (players.length === 0) {
    alert("Oyuncu yok!");
    return;
  }

  document.getElementById("playersWrapper").style.display = "none";
  const screen = document.getElementById("resultScreen");
  screen.style.display = "block";

  let i = 0;
  const interval = setInterval(() => {
    screen.textContent = "🎲 " + players[Math.floor(Math.random() * players.length)];
    i++;
    if (i > 25) {
      clearInterval(interval);
      const winner = players[Math.floor(Math.random() * players.length)];
      screen.textContent = "🏆 Kazanan: " + winner;
      confetti("left");
      confetti("right");
    }
  }, 90);
}

function confetti(side) {
  for (let i = 0; i < 30; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.background = `hsl(${Math.random()*360},100%,50%)`;
    c.style.bottom = "0";
    c.style[side] = "0";
    c.style.setProperty("--x", (side==="left"?1:-1)*(Math.random()*300)+"px");
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2500);
  }
}

/* 🦊 Tilkiler */
const foxes = ["🦊","🦊","🦊","🦊","🦊","🦊"];
for (let i = 0; i < 12; i++) {
  const f = document.createElement("div");
  f.className = "fox";
  f.textContent = foxes[Math.floor(Math.random()*foxes.length)];
  f.style.left = Math.random()*90+"vw";
  f.style.top = Math.random()*90+"vh";
  document.body.appendChild(f);
}
</script>

</body>
</html>
