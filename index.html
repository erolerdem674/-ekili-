<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Online Çekiliş</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: white;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .container {
      text-align: center;
      margin-top: 30px;
      position: relative;
      z-index: 2;
    }

    input {
      padding: 10px;
      width: 200px;
      font-size: 16px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      margin-left: 5px;
      cursor: pointer;
    }

    #nameList {
      margin-top: 20px;
      font-size: 18px;
    }

    #result {
      margin-top: 40px;
      font-size: 32px;
      font-weight: bold;
      min-height: 40px;
    }

    /* 🦊 Arka plan tilkiler */
    .fox {
      position: absolute;
      font-size: 32px;
      opacity: 0.25;
      user-select: none;
      z-index: 0;
    }

    /* 🎉 Konfeti */
    .confetti {
      position: fixed;
      bottom: 0;
      width: 10px;
      height: 10px;
      animation: pop 2s ease-out forwards;
    }

    @keyframes pop {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-300px) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1>🎲 Online Çekiliş</h1>

  <div class="container">
    <input id="nameInput" placeholder="İsim gir">
    <button onclick="addName()">Oyuncu Ekle</button>
    <button onclick="draw()">Çekiliş Yap</button>

    <div id="nameList"></div>
    <div id="result"></div>
  </div>

  <script>
    const names = [];

    const input = document.getElementById("nameInput");

    // ✅ ENTER ile ekleme
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        addName();
      }
    });

    function addName() {
      const value = input.value.trim();
      if (!value) return;

      names.push(value);

      const div = document.createElement("div");
      div.textContent = value;
      document.getElementById("nameList").appendChild(div);

      input.value = "";
    }

    function draw() {
      if (names.length === 0) {
        alert("Önce oyuncu ekle!");
        return;
      }

      const result = document.getElementById("result");
      let i = 0;

      const interval = setInterval(() => {
        result.textContent = "🎲 " + names[Math.floor(Math.random() * names.length)];
        i++;

        if (i > 20) {
          clearInterval(interval);
          const winner = names[Math.floor(Math.random() * names.length)];
          result.textContent = "🏆 Kazanan: " + winner;
          confetti();
        }
      }, 100);
    }

    /* 🎉 Konfeti patlaması */
    function confetti() {
      for (let i = 0; i < 30; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = (Math.random() * 50) + "vw";
        c.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
        document.body.appendChild(c);

        setTimeout(() => c.remove(), 2000);
      }
    }

    /* 🦊 Arka plan tilkiler */
    for (let i = 0; i < 8; i++) {
      const fox = document.createElement("div");
      fox.className = "fox";
      fox.textContent = "🦊";
      fox.style.left = Math.random() * 90 + "vw";
      fox.style.top = Math.random() * 90 + "vh";
      document.body.appendChild(fox);
    }
  </script>

</body>
</html>
