<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Tilki Kura Sistemi 🦊</title>

<style>
*{
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  margin:0;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  min-height:100vh;
  overflow:hidden;
}

.page{
  display:none;
  padding:30px;
  height:100vh;
}

.page.active{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* ---------- ANA SAYFA ---------- */
h1{
  margin-bottom:15px;
}

textarea{
  width:320px;
  height:180px;
  resize:none;
  padding:10px;
  font-size:16px;
  border-radius:8px;
  border:none;
}

button{
  margin-top:15px;
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#2ecc71;
  color:black;
  font-weight:bold;
}

button:hover{
  background:#27ae60;
}

.names{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:10px;
  width:80%;
}

.name-box{
  background:#2ecc71;
  color:black;
  padding:8px;
  border-radius:6px;
  text-align:center;
  font-weight:bold;
}

/* ---------- ÇEKİLİŞ EKRANI ---------- */
#drawBox{
  font-size:40px;
  margin:20px 0;
  min-height:60px;
}

#countdown{
  font-size:80px;
  font-weight:bold;
}

/* ---------- WINNER ---------- */
#winnerName{
  font-size:80px;
  font-weight:bold;
  text-align:center;
  margin:20px 0;
}

.fox{
  font-size:90px;
}

/* ---------- KONFETİ ---------- */
canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<!-- ===== ANA SAYFA ===== -->
<div class="page active" id="home">
  <h1>🦊 Tilki Kura Sistemi</h1>
  <p>Her satıra bir isim yaz</p>

  <textarea id="nameInput" placeholder="Ahmet
Mehmet
Ayşe"></textarea>

  <button onclick="updateList()">İsimleri Güncelle</button>
  <button onclick="startDraw()">🎉 Çekiliş Yap</button>

  <div class="names" id="nameList"></div>
</div>

<!-- ===== ÇEKİLİŞ ===== -->
<div class="page" id="draw">
  <h1>🎲 Çekiliş Yapılıyor</h1>
  <div id="countdown"></div>
  <div id="drawBox"></div>
</div>

<!-- ===== WINNER ===== -->
<div class="page" id="winner">
  <h1>KAZANAN</h1>
  <div class="fox">🦊</div>
  <div id="winnerName"></div>
  <div class="fox">🦊</div>

  <button onclick="goHome()">⬅ Ana Sayfaya Dön</button>
</div>

<script>
let names = [];
let canvas = document.getElementById("confetti");
let ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ---------- İSİM LİSTESİ ---------- */
function updateList(){
  const input = document.getElementById("nameInput").value;
  names = input.split("\n").map(n=>n.trim()).filter(n=>n);
  const list = document.getElementById("nameList");
  list.innerHTML="";
  names.forEach(n=>{
    const div = document.createElement("div");
    div.className="name-box";
    div.textContent=n;
    list.appendChild(div);
  });
}

/* ---------- ÇEKİLİŞ ---------- */
function startDraw(){
  if(names.length < 2){
    alert("En az 2 isim gir");
    return;
  }
  showPage("draw");
  countdown(3);
}

function countdown(num){
  const cd = document.getElementById("countdown");
  const box = document.getElementById("drawBox");
  box.textContent="";
  if(num>0){
    cd.textContent=num;
    setTimeout(()=>countdown(num-1),1000);
  }else{
    cd.textContent="";
    shuffleNames();
  }
}

function shuffleNames(){
  let i=0;
  const box = document.getElementById("drawBox");
  const interval = setInterval(()=>{
    box.textContent = names[Math.floor(Math.random()*names.length)];
    i++;
    if(i>25){
      clearInterval(interval);
      const winner = names[Math.floor(Math.random()*names.length)];
      showWinner(winner);
    }
  },100);
}

/* ---------- WINNER ---------- */
function showWinner(name){
  showPage("winner");
  document.getElementById("winnerName").textContent=name;
  launchConfetti();
}

function goHome(){
  showPage("home");
}

/* ---------- KONFETİ ---------- */
let confs=[];
function launchConfetti(){
  confs=[];
  for(let i=0;i<400;i++){
    confs.push({
      x:Math.random()<0.5?0:canvas.width,
      y:canvas.height,
      vx:(Math.random()*6+2)*(Math.random()<0.5?1:-1),
      vy:-Math.random()*8-4,
      size:Math.random()*6+4
    });
  }
  animateConfetti();
}

function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confs.forEach(c=>{
    c.x+=c.vx;
    c.y+=c.vy;
    c.vy+=0.15;
    ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;
    ctx.fillRect(c.x,c.y,c.size,c.size);
  });
  confs = confs.filter(c=>c.y<canvas.height);
  if(confs.length>0){
    requestAnimationFrame(animateConfetti);
  }
}
</script>

</body>
</html>
