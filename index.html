<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Online Kura Çekimi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f3, #d9e2ec);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: #fff;
    width: 420px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
}

input {
    width: calc(100% - 22px);
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #28a745;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #218838;
}

.list {
    max-height: 120px;
    overflow-y: auto;
    margin: 10px 0;
}

.list div {
    padding: 6px 8px;
    background: #f4f6f8;
    border-radius: 4px;
    margin-bottom: 4px;
    font-size: 14px;
}

.info {
    font-size: 13px;
    color: #444;
    margin-bottom: 10px;
    text-align: center;
}

.result {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
}

.footer {
    margin-top: 15px;
    font-size: 12px;
    color: #888;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">
    <h1>Online Kura Çekimi</h1>
    <div class="subtitle">Adayları ekleyin ve çekilişi başlatın</div>

    <input type="text" id="nameInput" placeholder="Aday adı girin">
    <button onclick="addName()">Aday Ekle</button>

    <div class="list" id="nameList"></div>

    <div class="info">
        Toplam Aday: <span id="count">0</span>
    </div>

    <button onclick="draw()">Çekilişi Başlat</button>

    <div class="result" id="result"></div>

    <div class="footer">
        © 2026 Online Çekiliş Sistemi
    </div>
</div>

<script>
const names = [];

// 🎯 KAZANMASINI İSTEDİĞİN İSİM (BURAYI DEĞİŞTİR)
const SABIT_KAZANAN = "@erdmerl_";

function addName() {
    const input = document.getElementById("nameInput");
    const value = input.value.trim();
    if (!value) return;

    names.push(value);

    const div = document.createElement("div");
    div.textContent = value;
    document.getElementById("nameList").appendChild(div);

    document.getElementById("count").textContent = names.length;
    input.value = "";
}

function draw() {
    if (names.length === 0) {
        alert("Lütfen aday ekleyin.");
        return;
    }

    const result = document.getElementById("result");
    let i = 0;

    result.textContent = "Çekiliş yapılıyor...";

    const interval = setInterval(() => {
        result.textContent = "🎲 " + names[Math.floor(Math.random() * names.length)];
        i++;
        if (i > 20) {
            clearInterval(interval);

            let kazanan;
            if (names.includes(SABIT_KAZANAN)) {
                kazanan = SABIT_KAZANAN;
            } else {
                kazanan = names[Math.floor(Math.random() * names.length)];
            }

            result.textContent = "🎉 Kazanan: " + kazanan;
        }
    }, 100);
}
</script>

</body>
</html>
