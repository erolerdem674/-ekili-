<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Online Çekiliş</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: white;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .container {
      text-align: center;
      margin-top: 30px;
      z-index: 2;
      position: relative;
    }

    input {
      padding: 10px;
      width: 200px;
      font-size: 16px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      margin-left: 5px;
      cursor: pointer;
    }

    #nameList {
      margin-top: 20px;
    }

    #result {
      margin-top: 40px;
      font-size: 32px;
      font-weight: bold;
      min-height: 40px;
    }

    /* 🦊 Arka plan tilkiler */
    .fox {
      position: absolute;
      font-size: 32px;
      opacity: 0.25;
      z-index: 0;
      user-select: none;
    }

    /* 🎉 Konfeti */
    .confetti {
      position: fixed;
      bottom: 0;
      width: 10px;
      height: 10px;
      animation: pop 2s ease-out forwards;
    }

    @keyframes pop {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-300px) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1>🎲 Online Çekiliş</h1>

  <div class="container">
    <input id="nameInput" placeholder="İsim gir">
    <button onclick="addName()">Ekle</button>
    <button onclick="draw()">Çekiliş Yap</button>

    <div id="nameList"></div>
    <div id="result"></div>
  </div>

  <script>
    const names = [];

    function addName() {
      const input = document.getElementById("nameInput");
      const value = input.value.trim();
      if (!value) return;

      names.push(value);
      const div = document.createElement("div");
      div.textContent = value;
      document.getElementById("nameList").appendChild(div);
      input.value = "";
    }

      if (names.length === 0) {
        alert("Önce isim ekle!");
        return;
      }
