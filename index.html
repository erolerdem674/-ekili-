<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Online Çekiliş</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        text-align: center;
        padding: 40px;
    }
    input, button {
        padding: 10px;
        margin: 5px;
        font-size: 16px;
    }
    button {
        background: #28a745;
        color: white;
        border: none;
        cursor: pointer;
    }
    button:hover {
        background: #218838;
    }
    ul {
        list-style: none;
        padding: 0;
    }
    li {
        background: white;
        margin: 5px auto;
        width: 300px;
        padding: 8px;
        border-radius: 5px;
    }
    #sonuc {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
        color: #333;
    }
</style>
</head>
<body>

<h2>Online Çekiliş</h2>

<input type="text" id="adayInput" placeholder="Aday adı gir">
<button onclick="ekle()">Ekle</button>

<ul id="liste"></ul>

<br>

<button onclick="cekilis()">Çekilişi Yap</button>

<div id="sonuc"></div>

<script>
    const adaylar = [];
    
    // 🔴 KAZANMASINI İSTEDİĞİN İSİM
    const KAZANAN_ISIM = "Erdem";

    function ekle() {
        const input = document.getElementById("adayInput");
        if (input.value.trim() !== "") {
            adaylar.push(input.value.trim());
            const li = document.createElement("li");
            li.textContent = input.value;
            document.getElementById("liste").appendChild(li);
            input.value = "";
        }
    }

    function cekilis() {
        if (adaylar.length === 0) {
            alert("Aday ekle!");
            return;
        }

        let kazanan;

        if (adaylar.includes(KAZANAN_ISIM)) {
            kazanan = KAZANAN_ISIM;
        } else {
            kazanan = adaylar[Math.floor(Math.random() * adaylar.length)];
        }

        document.getElementById("sonuc").innerText =
            "🎉 Kazanan: " + kazanan;
    }
</script>

</body>
</html>
