<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Online Çekiliş</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #ffffff;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      margin-top: 25px;
      font-weight: 600;
    }

    .container {
      text-align: center;
      margin-top: 30px;
      position: relative;
      z-index: 2;
    }

    input {
      padding: 12px;
      width: 220px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      margin-left: 6px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #2ecc71;
      color: white;
    }

    button:last-child {
      background: #3498db;
    }

    #nameList {
      margin-top: 20px;
      font-size: 17px;
      opacity: 0.85;
    }

    #result {
      margin-top: 45px;
      font-size: 34px;
      font-weight: bold;
      min-height: 40px;
    }

    /* 🦊 Tilkiler */
    .fox {
      position: absolute;
      font-size: 48px;
      opacity: 0.22;
      user-select: none;
      z-index: 0;
    }

    /* 🎉 Konfeti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      animation: fly 2.5s ease-out forwards;
    }

    @keyframes fly {
      0% {
        transform: translate(0,0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--x), -350px) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1>🎲 Online Çekiliş Sistemi</h1>

  <div class="container">
    <input id="nameInput" placeholder="Oyuncu adı gir">
    <button onclick="addName()">Oyuncu Ekle</button>
    <button onclick="draw()">Çekiliş Yap</button>

    <div id="nameList"></div>
    <div id="result"></div>
  </div>

  <script>
    const names = [];
    const input = document.getElementById("nameInput");

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") addName();
    });

    function addName() {
      const value = input.value.trim();
      if (!value) return;

      names.push(value);

      const div = document.createElement("div");
      div.textContent = "• " + value;
      document.getElementById("nameList").appendChild(div);

      input.value = "";
    }

    function draw() {
      if (names.length === 0) {
        alert("Önce oyuncu ekle!");
        return;
      }

      const result = document.getElementById("result");
      let i = 0;

      const interval = setInterval(() => {
        result.textContent = "🎲 " + names[Math.floor(Math.random() * names.length)];
        i++;

        if (i > 22) {
          clearInterval(interval);
          const winner = names[Math.floor(Math.random() * names.length)];
          result.textContent = "🏆 Kazanan: " + winner;
          confettiSide("left");
          confettiSide("right");
        }
      }, 90);
    }

    function confettiSide(side) {
      for (let i = 0; i < 25; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
        c.style.bottom = "0px";
        c.style[side] = "0px";
        c.style.setProperty("--x", (side === "left" ? 1 : -1) * (Math.random() * 300) + "px");
        document.body.appendChild(c);

        setTimeout(() => c.remove(), 2500);
      }
    }

    /* 🦊 Daha fazla ve büyük tilki */
    for (let i = 0; i < 14; i++) {
      const fox = document.createElement("div");
      fox.className = "fox";
      fox.textContent = "🦊";
      fox.style.left = Math.random() * 95 + "vw";
      fox.style.top = Math.random() * 95 + "vh";
      document.body.appendChild(fox);
    }
  </script>

</body>
</html>
